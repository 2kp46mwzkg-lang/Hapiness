<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pauses">
<title>Journal des pauses</title>
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" type="image/png" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0e1716; --lune:#e6dfcd; --brume:#94a6a1;
  --parchemin:#ece2cc; --encre:#2b1d17; --encre-2:#5e4a3f; --encre-3:#7d6a5c;
  --sang:#7d1424; --sang-barre:#a3283a; --lapis:#1f4e8c; --lapis-barre:#2c64ad; --bougie:#c89b3c;
  --trait:rgba(43,29,23,.16);
  --serif:'EB Garamond','Garamond','Georgia','Liberation Serif',serif;
  --plume:'Pinyon Script','Snell Roundhand','Apple Chancery','URW Chancery L',cursive;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--lune);font-family:var(--serif);font-size:18px;line-height:1.45;background:var(--nuit)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(75% 36% at 88% 0%,rgba(150,178,172,.20),transparent 70%),
  linear-gradient(180deg,#14241f 0%,#0e1716 40%,#0a1211 100%)}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--bougie);outline-offset:2px}
.page :focus-visible,.feuille :focus-visible{outline-color:var(--lapis)}
[hidden]{display:none!important}

.wrap{max-width:620px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 14px calc(100px + var(--safe-b))}

/* En-tête : ciel, titre à la plume, sceau de cire */
.tete{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:0 4px}
.titre{font-family:var(--plume);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:1.05;margin:0;color:var(--lune)}
.etat{margin:4px 0 0;font-size:15px;color:var(--brume);font-style:italic;min-height:1.4em}
.sceau{flex:none;width:60px;height:60px;border:0;padding:0;background:none;border-radius:50%;margin-top:2px}
.sceau svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.sceau .cire{fill:url(#cireG)}
.sceau .anneau{fill:none;stroke:rgba(0,0,0,.30);stroke-width:2}
.sceau .lunette{fill:#e9cda6;opacity:.92}
.sceau[data-state=local] .cire{fill:#565d59}
.sceau[data-state=pending] svg{opacity:.55}
.sceau[data-state=saving] svg{animation:souffle 1.1s ease-in-out infinite}
.sceau[data-state=error] .cire,.sceau[data-state=offline] .cire{fill:#5d4038}
.sceau[data-state=error] .lunette,.sceau[data-state=offline] .lunette{opacity:.45}
.sceau.frappe svg{animation:frappe .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes frappe{0%{transform:scale(1.4) rotate(-14deg);opacity:.35}60%{transform:scale(.93) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes souffle{50%{opacity:.55}}
.foret{display:block;width:calc(100% + 28px);height:46px;margin:2px -14px 0}
.foret .loin{fill:#152723}
.foret .pres{fill:#070d0c}

/* Navigation des jours */
.jour{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.nav{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(230,223,205,.25);background:transparent;color:var(--lune);display:grid;place-items:center}
.nav svg,.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.jour-l{position:relative;flex:1;text-align:center;cursor:pointer;display:block;padding:2px 0}
.jour-nom{display:block;font-family:var(--plume);font-size:34px;line-height:1.1}
.jour-date{display:block;font-size:17px;color:var(--brume)}
.jour-l input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none}
.retour{text-align:center;margin:0 0 8px}
.retour .lien{color:var(--bougie)}

.onglets-pause{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.onglets-pause::-webkit-scrollbar{display:none}
.op{flex:none;border:1px solid rgba(230,223,205,.3);background:transparent;color:var(--lune);border-radius:999px;padding:8px 14px;font-size:16px;white-space:nowrap;min-height:40px}
.op[aria-pressed=true]{background:var(--parchemin);color:var(--encre);border-color:var(--parchemin)}
.op .h{font-variant-numeric:lining-nums tabular-nums;opacity:.72;margin-right:6px}
.op-plus{border-style:dashed;color:var(--brume)}

.bandeau{border:1px solid rgba(200,155,60,.45);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:16px;background:rgba(200,155,60,.08);color:var(--lune)}
.bandeau .lien{color:var(--bougie)}
.bandeau.alerte{border-color:rgba(190,70,80,.6);background:rgba(125,20,36,.18)}

/* La page de journal : parchemin réglé, marge rouge */
.page{position:relative;background-color:var(--parchemin);color:var(--encre);border-radius:3px;padding:20px 18px 22px 42px;
  background-image:linear-gradient(90deg,transparent 28px,rgba(125,20,36,.5) 28px,rgba(125,20,36,.5) 29px,transparent 29px);
  box-shadow:inset 0 0 70px rgba(120,85,45,.24),inset 0 0 0 1px rgba(255,255,255,.22),0 22px 40px -14px rgba(0,0,0,.65)}
.page + .page{margin-top:18px}
.page h2{font-size:24px;font-weight:600;margin:0 0 6px;line-height:1.2}
.page h3{margin:0}
.cher{font-family:var(--plume);font-size:32px;line-height:1.05;margin:0 0 2px;color:var(--sang)}
.page-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.page-titre{font-size:23px;font-weight:600;margin:0;line-height:1.25}
.page-sous{font-size:17px;color:var(--encre-2);margin:4px 0 0;font-style:italic}
.page p{margin:0 0 10px}
.page .aide{font-size:15px;color:var(--encre-2);margin:8px 0 0}

.rapide{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px;margin:14px 0 0}
.compte{font-size:15px;color:var(--encre-2);font-style:italic}
.personnes{margin:8px 0 0;padding:0;list-style:none}
.pers{padding:16px 0 14px;border-top:1px solid var(--trait)}
.pers-tete{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.pers-nom{margin:0;font-size:22px;font-weight:600;line-height:1.2}
.pers-trace{font-size:14px;color:var(--encre-3);font-style:italic;text-align:right}
.pers.absent .pers-nom{color:var(--encre-3)}
.presence{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid rgba(43,29,23,.35);border-radius:8px;overflow:hidden}
.pr{font-size:16px;padding:8px 4px;background:transparent;border:0;color:var(--encre);min-height:44px}
.pr + .pr{border-left:1px solid rgba(43,29,23,.25)}
.pr-present[aria-pressed=true]{background:var(--sang);color:#f6ecd8}
.pr-late[aria-pressed=true]{background:var(--bougie);color:var(--encre)}
.pr-absent[aria-pressed=true]{background:var(--encre);color:var(--parchemin)}
.comportements{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.puce{font-size:16px;display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 9px;min-height:38px;border-radius:999px;border:1px solid rgba(43,29,23,.32);background:rgba(255,255,255,.2);color:var(--encre)}
.puce[aria-pressed=true]{background:var(--lapis);border-color:var(--lapis);color:#f3ead6}
.emo{font-size:17px;line-height:1}
.note{display:block;width:100%;margin-top:10px;font-style:italic;font-size:17px;color:var(--encre);background:transparent;border:0;border-bottom:1px dashed rgba(43,29,23,.4);padding:6px 2px;resize:none;min-height:2.4em;line-height:1.4;border-radius:0}
.note:focus{outline:none;border-bottom-color:var(--lapis);background:rgba(255,255,255,.22)}
.note::placeholder{color:var(--encre-3)}
.zone-note{margin-top:6px}

.lien{background:none;border:0;padding:6px 0;color:var(--lapis);font-size:16px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-align:left}
.btn{font-size:17px;padding:10px 16px;border-radius:7px;border:1px solid var(--sang);background:var(--sang);color:#f6ecd8;min-height:44px;line-height:1.2}
.btn-sec{background:transparent;color:var(--encre);border-color:rgba(43,29,23,.4)}
.btn-danger{background:transparent;color:var(--sang);border-color:var(--sang)}
.pile{display:flex;flex-direction:column;gap:10px;margin-top:16px;align-items:stretch}
.pile .btn{text-align:left}

/* Journal */
.j-pause{margin:16px 0 0}
.j-pause:first-of-type{margin-top:8px}
.j-titre{background:none;border:0;padding:0;font-size:20px;font-weight:600;color:var(--encre);text-align:left;text-decoration:underline;text-decoration-color:rgba(43,29,23,.25);text-underline-offset:4px}
.j-liste{list-style:none;margin:6px 0 0;padding:0}
.ligne{padding:8px 0;border-top:1px solid var(--trait)}
.l-nom{font-weight:600}
.l-pres{font-style:italic;color:var(--encre-2);white-space:nowrap}
.l-pres::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 6px 1px 8px;vertical-align:middle;border:1.5px solid var(--encre-2)}
.l-present::before{background:var(--sang);border-color:var(--sang)}
.l-late::before{background:var(--bougie);border-color:var(--bougie)}
.l-absent::before{background:transparent}
.l-comp,.l-note{display:block;font-size:16px}
.l-note{font-style:italic;color:var(--encre-2)}
.filtre{display:flex;align-items:center;gap:10px;margin:14px 2px 14px;color:var(--brume);font-size:16px}
.filtre select,.segment{flex:1}
.filtre select{font-size:17px;padding:9px 10px;border-radius:7px;border:1px solid rgba(230,223,205,.3);background:#132220;color:var(--lune)}
.plus{display:flex;justify-content:center;margin-top:16px}
.plus .btn-sec{color:var(--lune);border-color:rgba(230,223,205,.35)}

/* Bilan */
.segment{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid rgba(230,223,205,.3);border-radius:8px;overflow:hidden;margin:14px 0}
.segment button{background:transparent;border:0;color:var(--lune);font-size:16px;padding:9px 4px;min-height:42px}
.segment button + button{border-left:1px solid rgba(230,223,205,.18)}
.segment button[aria-pressed=true]{background:var(--parchemin);color:var(--encre)}
.stat{padding:16px 0 12px;border-top:1px solid var(--trait)}
.stat:first-of-type{margin-top:12px}
.phrase{font-size:17px;margin:4px 0 8px!important;color:var(--encre-2)}
.rang{display:grid;grid-template-columns:minmax(7.5em,40%) 1fr 4.4em;align-items:center;gap:10px;font-size:16px;padding:4px 0}
.rang.tete-rang{font-weight:600}
.piste{position:relative;height:8px;background:rgba(43,29,23,.1);border-radius:0 4px 4px 0}
.rempli{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--lapis-barre)}
.rempli.sang{background:var(--sang-barre)}
.val{text-align:right;font-variant-numeric:tabular-nums lining-nums;color:var(--encre-2);white-space:nowrap}
.retire{font-weight:400;font-style:italic;color:var(--encre-3);font-size:16px}

/* Réglages */
.champ{display:block;margin:0 0 12px}
.champ > span{display:block;font-size:15px;color:var(--encre-2);margin-bottom:4px}
.champ input,.champ select,.champ textarea,.ajout input,.saisie{width:100%;font-size:17px;padding:10px 12px;border:1px solid rgba(43,29,23,.32);border-radius:7px;background:rgba(255,255,255,.45);color:var(--encre)}
.champ small{display:block;font-size:14px;color:var(--encre-3);margin-top:4px;line-height:1.35}
.etiq{display:block;font-size:15px;color:var(--encre-2);margin-bottom:4px}
.jeton{display:flex;gap:6px;align-items:stretch}
.jeton input{flex:1;min-width:0}
.masque{-webkit-text-security:disc}
.champ small .ok{color:#2d5a2a}
.champ small .ko{color:var(--sang)}
.champ small b{font-weight:600}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ajout{display:flex;gap:8px;margin-top:12px}
.ajout input{flex:1;min-width:0}
.ajout .emoji-in{flex:0 0 3.4em;text-align:center}
.ajout.trois{flex-wrap:wrap}
.ajout.trois input[name=label]{flex:1 1 100%}
.ajout .heure-in{flex:1 1 auto;width:auto}
.liste{list-style:none;margin:10px 0 0;padding:0}
.liste li{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--trait)}
.liste .nom{flex:1;min-width:0;overflow-wrap:anywhere}
.liste .groupe{display:block;font-size:14px;color:var(--encre-3);font-style:italic}
.mini{font-size:15px;padding:6px 10px;border-radius:6px;border:1px solid rgba(43,29,23,.3);background:transparent;color:var(--encre);min-height:38px;min-width:38px}
details{margin-top:12px}
summary{cursor:pointer;color:var(--encre-2);font-size:16px}
.cnx{font-size:16px;padding:10px 12px;border-radius:7px;background:rgba(43,29,23,.06);margin:0 0 14px!important}
.cnx.ko{background:rgba(125,20,36,.1);color:var(--sang)}
.case{display:flex;gap:10px;align-items:flex-start;font-size:16px;margin:10px 0}
.case input{width:20px;height:20px;margin-top:2px;flex:none}
.fichier{position:relative;cursor:pointer;overflow:hidden}
.fichier input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0}
.version{font-size:14px;color:var(--brume);text-align:center;margin-top:20px}

/* Barre d'onglets */
.barre-onglets{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(9,15,14,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid rgba(230,223,205,.12);padding:4px 8px calc(4px + var(--safe-b));display:flex;justify-content:center}
.barre-onglets .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:620px}
.tab{background:none;border:0;color:var(--brume);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;font-size:14px}
.tab svg{width:25px;height:25px}
.tab[aria-current=page]{color:var(--lune)}
.tab[aria-current=page] svg{stroke:var(--bougie)}

/* Feuilles (fenêtres) et messages */
.voile{position:fixed;inset:0;background:rgba(3,7,6,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.feuille{background:var(--parchemin);color:var(--encre);width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 20px calc(20px + var(--safe-b));box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:monte .22s ease-out}
.feuille h2{margin:0 0 14px;font-size:24px;font-weight:600}
.feuille p{margin:0 0 12px}
.feuille .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.modeles-mini{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
@keyframes monte{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);background:#1c2a27;color:var(--lune);border:1px solid rgba(230,223,205,.2);padding:10px 16px;border-radius:8px;z-index:60;font-size:16px;max-width:min(92vw,560px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.voile{align-items:center}.feuille{border-radius:12px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="barre-onglets" id="onglets" aria-label="Sections"></nav>
<div id="feuille-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(function(){
'use strict';
var VERSION = '1.3';
var DEPOT_DONNEES = 'hapiness';   // dépôt GitHub où est rangé journal.json

/* ============================================================
   Outils
   ============================================================ */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function clone(o){ return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
function values(o){ return Object.keys(o || {}).map(function(k){ return o[k]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
var lastTs = 0;
function now(){ var t = Date.now(); lastTs = t > lastTs ? t : lastTs + 1; return lastTs; }

var store = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
var K = { doc:'jdp.doc', cfg:'jdp.cfg', me:'jdp.me', ui:'jdp.ui', pending:'jdp.pending' };

function b64enc(str){
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64){
  var bin = atob(String(b64).replace(/\s/g, '')), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function toUrl64(s){ return b64enc(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function fromUrl64(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return b64dec(s); }

/* Dates */
function pad(n){ return String(n).padStart(2, '0'); }
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function parseD(s){ var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(s, n){ var d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); }
var fJour = new Intl.DateTimeFormat('fr-FR', { weekday:'long' });
var fDate = new Intl.DateTimeFormat('fr-FR', { day:'numeric', month:'long', year:'numeric' });
var fCourt = new Intl.DateTimeFormat('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
var fHM = new Intl.DateTimeFormat('fr-FR', { hour:'2-digit', minute:'2-digit' });
var fJM = new Intl.DateTimeFormat('fr-FR', { day:'numeric', month:'short' });
function fmtDay(s){ return fJour.format(parseD(s)); }
function fmtDate(s){ return fDate.format(parseD(s)); }
function fmtShort(s){ return fCourt.format(parseD(s)); }
function fmtHM(ts){ return fHM.format(new Date(ts)); }
function fmtWhen(ts){ if (!ts) return ''; var d = new Date(ts); return dstr(d) === todayStr() ? 'à ' + fmtHM(ts) : 'le ' + fJM.format(d) + ' à ' + fmtHM(ts); }
function nowHM(){ var d = new Date(); var m = Math.round(d.getMinutes() / 5) * 5; if (m === 60){ d.setHours(d.getHours() + 1); m = 0; } return pad(d.getHours()) + ':' + pad(m); }

/* ============================================================
   Données : un document, des collections d'enregistrements.
   Chaque champ porte son horodatage (_t) : deux personnes qui
   modifient en même temps sont fusionnées champ par champ,
   la modification la plus récente l'emporte.
   ============================================================ */
var COLLS = ['meta', 'people', 'behaviors', 'templates', 'pauses', 'entries'];
var DEFAULT_BEHAVIORS = [
  ['b-joie', '😊', 'Joyeux·se', ''],
  ['b-rit', '😂', 'Rit', ''],
  ['b-parle', '💬', 'Parle', 'parole'],
  ['b-muet', '🤐', 'Ne parle pas', 'parole'],
  ['b-fatigue', '😴', 'Fatigué·e', ''],
  ['b-contrarie', '😠', 'Contrarié·e', ''],
  ['b-tel', '📱', 'Sur son téléphone', '']
];
var DEFAULT_TEMPLATES = [
  ['t-matin', 'Pause du matin', '10:00'],
  ['t-midi', 'Pause déjeuner', '12:00'],
  ['t-aprem', 'Pause de l’après-midi', '15:30']
];
var PRES = { present:'Présent·e', late:'En retard', absent:'Absent·e' };

function emptyDoc(){ var d = { format:'journal-des-pauses', version:1 }; COLLS.forEach(function(c){ d[c] = {}; }); return d; }
function put(doc, coll, id, fields, ts){
  var r = doc[coll][id] || (doc[coll][id] = { id:id, _t:{} });
  if (!r._t) r._t = {};
  Object.keys(fields).forEach(function(f){ r[f] = fields[f]; r._t[f] = ts; });
  return r;
}
function seedDoc(){
  var d = emptyDoc();
  put(d, 'meta', 'main', { title:'Journal des pauses' }, 1);
  DEFAULT_BEHAVIORS.forEach(function(b, i){ put(d, 'behaviors', b[0], { emoji:b[1], label:b[2], group:b[3], order:i, archived:false }, 1); });
  DEFAULT_TEMPLATES.forEach(function(t, i){ put(d, 'templates', t[0], { label:t[1], time:t[2], order:i, archived:false }, 1); });
  return d;
}
function normalizeDoc(d){
  var out = emptyDoc();
  if (!d || typeof d !== 'object') return out;
  COLLS.forEach(function(c){
    var src = d[c];
    if (!src || typeof src !== 'object') return;
    Object.keys(src).forEach(function(k){
      var r = src[k];
      if (r && typeof r === 'object' && !Array.isArray(r)) out[c][k] = Object.assign({}, r, { id:k, _t:Object.assign({}, r._t || {}) });
    });
  });
  return out;
}
function cmpVal(a, b){ var x = JSON.stringify(a === undefined ? null : a), y = JSON.stringify(b === undefined ? null : b); return x < y ? -1 : x > y ? 1 : 0; }
function mergeRecord(a, b, id){
  if (!a) return clone(b);
  if (!b) return clone(a);
  var ta = a._t || {}, tb = b._t || {}, out = { id:a.id || b.id || id, _t:{} };
  var fields = {};
  Object.keys(ta).forEach(function(f){ fields[f] = 1; });
  Object.keys(tb).forEach(function(f){ fields[f] = 1; });
  Object.keys(fields).forEach(function(f){
    var x = ta[f] || 0, y = tb[f] || 0;
    var takeB = y > x || (y === x && cmpVal(b[f], a[f]) > 0);
    var src = takeB ? b : a;
    if (src[f] !== undefined) out[f] = clone(src[f]);
    out._t[f] = takeB ? y : x;
  });
  return out;
}
function mergeDocs(a, b){
  var out = emptyDoc();
  COLLS.forEach(function(c){
    var A = (a && a[c]) || {}, B = (b && b[c]) || {}, keys = {};
    Object.keys(A).forEach(function(k){ keys[k] = 1; });
    Object.keys(B).forEach(function(k){ keys[k] = 1; });
    Object.keys(keys).forEach(function(k){ out[c][k] = mergeRecord(A[k], B[k], k); });
  });
  return out;
}
/* a contient-il au moins un champ plus récent (ou gagnant) que b ? */
function hasNewer(a, b){
  for (var i = 0; i < COLLS.length; i++){
    var c = COLLS[i], A = a[c] || {}, B = (b && b[c]) || {};
    for (var k in A){
      var ta = A[k]._t || {}, rb = B[k], tb = (rb && rb._t) || {};
      for (var f in ta){
        var x = ta[f] || 0, y = tb[f] || 0;
        if (x > y) return true;
        if (x === y && x > 0 && cmpVal(A[k][f], rb ? rb[f] : undefined) > 0) return true;
      }
    }
  }
  return false;
}
/* Fichier compact : l'identifiant de chaque enregistrement est déjà sa clé */
function serialize(doc){
  return JSON.stringify(doc, function(k, v){ return (k === 'id' && this && this._t) ? undefined : v; }) + '\n';
}
/* Jeton : on extrait le jeton même si le texte collé contient autre chose (espaces, retour à la ligne, libellé) */
function cleanToken(v){
  v = String(v || '');
  var m = v.match(/github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]{20,}/);
  return m ? m[0] : v.replace(/\s+/g, '');
}
function tokenOk(t){ return /^(github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})$/.test(t); }
function tokenHint(v){
  var t = cleanToken(v);
  if (!t) return S.cfg && S.cfg.token
    ? 'Un jeton est enregistré sur cet appareil. Laisse vide pour le garder.'
    : 'Jeton « fine-grained » limité à ce dépôt, permission Contents en lecture et écriture. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Créer un jeton</a>. Il reste sur cet appareil.';
  if (tokenOk(t)) return '<b class="ok">Jeton reconnu</b> : ' + esc(t.slice(0, 15)) + '…' + esc(t.slice(-4)) + ' (' + t.length + ' caractères). Touche « Relier le journal ».';
  return '<b class="ko">Ce n’est pas un jeton complet</b> : il doit commencer par github_pat_ et faire environ 90 caractères. Recopie-le depuis GitHub.';
}
/* Quand le dépôt est introuvable : on demande à GitHub ce que le jeton voit vraiment */
async function diagnose(cfg){
  try{
    var r = await GH.req('https://api.github.com/user', { headers:GH.hdr(cfg) });
    if (r.status === 401) return 'Jeton refusé par GitHub : il est peut-être expiré, supprimé ou mal copié.';
    if (!r.ok) return null;
    var me = await r.json(), login = me.login || '?';
    var full = (cfg.owner + '/' + cfg.repo).toLowerCase();
    var r2 = await GH.req('https://api.github.com/user/repos?per_page=100&sort=updated', { headers:GH.hdr(cfg) });
    var names = r2.ok ? (await r2.json()).map(function(x){ return x.full_name; }) : null;
    if (login.toLowerCase() !== cfg.owner.toLowerCase())
      return 'Ce jeton appartient au compte « ' + login + ' », pas à « ' + cfg.owner + ' ». Vérifie le champ Compte GitHub.';
    if (names && names.some(function(n){ return n.toLowerCase() === full; })) return null;
    var vus = names && names.length ? names.map(function(n){ return n.split('/')[1]; }).join(', ') : 'aucun';
    return 'Le jeton fonctionne (compte ' + login + '), mais il ne voit pas le dépôt « ' + cfg.repo + ' ». Dépôts qu’il voit : ' + vus + '. ' +
      'Sur GitHub, ouvre le jeton, touche Edit : Repository access = Only select repositories avec « ' + cfg.repo + ' », et Permissions = Contents : Read and write, puis enregistre. ' +
      'Si ce dépôt n’existe pas encore, crée-le d’abord (privé, avec un README) sous ce nom exact.';
  }catch(e){ return null; }
}
/* Dépôt qui héberge le site (https://compte.github.io/<dépôt>/) */
function siteRepo(){
  if (!/\.github\.io$/i.test(location.hostname)) return '';
  var seg = location.pathname.split('/').filter(Boolean)[0] || '';
  return /\.html?$/i.test(seg) ? '' : decodeURIComponent(seg);
}
/* Si les données sont dans le même dépôt que le site, on les range sur une branche à part :
   le site n'est pas republié à chaque note et journal.json n'apparaît pas sur le site. */
function defaultBranch(repo){ return repo && siteRepo() && repo.toLowerCase() === siteRepo().toLowerCase() ? 'donnees' : 'main'; }
function showTokenState(v){
  var h = $('#jeton-etat'); if (h) h.innerHTML = tokenHint(v);
  var box = $('.cnx');
  if (tokenOk(cleanToken(v)) && S.cnxMsg && box){ S.cnxMsg = null; box.className = 'cnx'; box.textContent = 'Jeton prêt : touche « Relier le journal ».'; }
}

  return values(doc.pauses).some(function(p){ return !p.deleted; }) || values(doc.people).some(function(p){ return !p.archived; });
}

function byName(a, b){ return (a.name || '').localeCompare(b.name || '', 'fr', { sensitivity:'base' }); }
function byOrder(a, b){ return ((a.order || 0) - (b.order || 0)) || (a.label || '').localeCompare(b.label || '', 'fr'); }
function byTime(a, b){ return (a.time || '').localeCompare(b.time || '') || (a.label || '').localeCompare(b.label || '', 'fr'); }
function activePeople(){ return values(S.doc.people).filter(function(p){ return !p.archived && p.name; }).sort(byName); }
function archivedPeople(){ return values(S.doc.people).filter(function(p){ return p.archived && p.name; }).sort(byName); }
function allPeople(){ return values(S.doc.people).filter(function(p){ return p.name; }).sort(byName); }

/* Écriture */
function setFields(coll, id, fields, opt){
  opt = opt || {};
  if (!canEdit()){ toast('Lecture seule : ajoute un jeton dans les réglages pour pouvoir écrire.'); return false; }
  var ts = now();
  put(S.doc, coll, id, Object.assign({}, fields, { by:S.me || '', at:ts }), ts);
  if (coll === 'pauses') S.lastTouch = S.doc.pauses[id].date;
  if (coll === 'entries'){ var p = S.doc.pauses[S.doc.entries[id].pauseId]; if (p) S.lastTouch = p.date; }

}

/* ============================================================
   GitHub : lecture / écriture d'un fichier JSON via l'API Contents
   ============================================================ */
function mkErr(kind, msg, extra){ var e = new Error(msg); e.kind = kind; return Object.assign(e, extra || {}); }
var GH = {
  url: function(cfg, suffix){ return 'https://api.github.com/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) + (suffix || ''); },
  fileUrl: function(cfg){ return this.url(cfg, '/contents/' + cfg.path.split('/').map(encodeURIComponent).join('/')); },
  hdr: function(cfg, extra){ var h = { 'Accept':'application/vnd.github+json' }; if (cfg.token) h.Authorization = 'Bearer ' + cfg.token; return Object.assign(h, extra || {}); },
  req: function(url, opt){
    return fetch(url, Object.assign({ cache:'no-store' }, opt)).catch(function(){
      throw mkErr('network', 'Pas de réseau : tes modifications restent sur cet appareil et partiront au retour de la connexion.');
    });
  },
  repo: function(cfg){ var self = this; return self.req(self.url(cfg), { headers:self.hdr(cfg) }).then(function(r){ if (!r.ok) return httpErr(r, cfg).then(function(e){ throw e; }); return r.json(); }); },
  branch: function(cfg){ var self = this; return self.req(self.url(cfg, '/branches/' + encodeURIComponent(cfg.branch)), { headers:self.hdr(cfg) }).then(function(r){ if (r.status === 404) return null; if (!r.ok) return httpErr(r, cfg).then(function(e){ throw e; }); return r.json(); }); },
  createBranch: async function(cfg, base){
    var r = await this.req(this.url(cfg, '/git/ref/heads/' + encodeURIComponent(base)), { headers:this.hdr(cfg) });
    if (!r.ok) throw await httpErr(r, cfg);
    var j = await r.json();
    var r2 = await this.req(this.url(cfg, '/git/refs'), { method:'POST', headers:this.hdr(cfg, { 'Content-Type':'application/json' }), body:JSON.stringify({ ref:'refs/heads/' + cfg.branch, sha:j.object.sha }) });
    if (!r2.ok && r2.status !== 422) throw await httpErr(r2, cfg);
  },
  get: async function(cfg, etag){
    var u = this.fileUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch);
    var r = await this.req(u, { headers:this.hdr(cfg, etag ? { 'If-None-Match':etag } : null) });
    if (r.status === 304) return { notModified:true };
    if (r.status === 404) return { missing:true };
    if (!r.ok) throw await httpErr(r, cfg);
    var j = await r.json(), text;
    if (Array.isArray(j) || j.type !== 'file') throw mkErr('format', '« ' + cfg.path + ' » est un dossier, pas un fichier. Indique un nom de fichier, par exemple journal.json.');
    if (j.encoding === 'base64' && j.content) text = b64dec(j.content);
    else if (!j.size) text = '';
    else {
      var r2 = await this.req(u, { headers:this.hdr(cfg, { 'Accept':'application/vnd.github.raw' }) });
      if (!r2.ok) throw await httpErr(r2, cfg);
      text = await r2.text();
    }
    return { sha:j.sha, etag:r.headers.get('ETag'), doc:parseRemote(text, cfg.path) };
  },
  put: async function(cfg, doc, sha, message){
    var body = { message:message, content:b64enc(serialize(doc)), branch:cfg.branch };
    if (sha) body.sha = sha;
    var r = await this.req(this.fileUrl(cfg), { method:'PUT', headers:this.hdr(cfg, { 'Content-Type':'application/json' }), body:JSON.stringify(body) });
    if (r.status === 409 || r.status === 422){
      var j = {}; try{ j = await r.json(); }catch(e){}
      if (r.status === 422 && !/sha/i.test(j.message || '')) throw mkErr('other', 'GitHub a refusé l’enregistrement : ' + (j.message || 'erreur 422') + '.');
      return { conflict:true };
    }
    if (!r.ok) throw await httpErr(r, cfg);
    var res = await r.json();
    return { sha:res.content && res.content.sha };
  }
};
async function httpErr(r, cfg){
  var j = {}; try{ j = await r.json(); }catch(e){}
  if (r.status === 401) return mkErr('auth', 'Jeton refusé par GitHub : il est peut-être expiré ou mal copié. Colle un nouveau jeton dans les réglages.');
  if (r.status === 403 || r.status === 429){
    if (r.headers.get('x-ratelimit-remaining') === '0'){
      var reset = (+r.headers.get('x-ratelimit-reset') || 0) * 1000 || Date.now() + 60000;
      return mkErr('rate', 'Trop d’appels à GitHub : nouvel essai vers ' + fmtHM(reset) + '.', { reset:reset });
    }
    return mkErr('perm', cfg.token ? 'Ce jeton n’a pas le droit d’écrire dans « ' + cfg.repo + ' » : il lui faut la permission Contents en lecture et écriture sur ce dépôt.' : 'Accès refusé par GitHub.');
  }
  if (r.status === 404) return mkErr('notfound', cfg.token ? 'Dépôt « ' + cfg.owner + '/' + cfg.repo + ' » introuvable, ou le jeton n’y a pas accès.' : 'Dépôt « ' + cfg.owner + '/' + cfg.repo + ' » introuvable. S’il est privé, il faut un jeton.');
  return mkErr('other', 'GitHub a répondu ' + r.status + (j.message ? ' : ' + j.message : '') + '.');
}
function parseRemote(text, path){
  if (!String(text).trim()) return emptyDoc();
  var o;
  try{ o = JSON.parse(text); }catch(e){ throw mkErr('format', 'Le fichier « ' + path + ' » n’est pas un JSON lisible. Rien n’a été écrasé.'); }
  if (!o || typeof o !== 'object' || (Object.keys(o).length && o.format !== 'journal-des-pauses'))
    throw mkErr('format', 'Le fichier « ' + path + ' » ne contient pas un journal des pauses. Rien n’a été écrasé : choisis un autre nom de fichier.');
  return normalizeDoc(o);
}

/* ============================================================
   Synchronisation
   ============================================================ */
var syncing = false, polling = false, again = false, saveTimer = null, lastPoll = 0;

function touched(){
  S.pending = true;
  persistDoc();
  if (shared() && canEdit()){
    setSync('pending');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(syncNow, 4000);
  }
}
function commitMsg(){
  return 'Journal des pauses : ' + (S.lastTouch ? 'pause du ' + fmtShort(S.lastTouch) : 'réglages') + (S.me ? ' (' + S.me + ')' : '');
}
function handleErr(e){
  var k = e.kind || 'other';
  if (k === 'network') setSync('offline', e.message);
  else {
    setSync('error', e.message);
    if (k === 'rate') S.backoffUntil = e.reset || Date.now() + 60000;
    if (k === 'auth' || k === 'perm' || k === 'notfound' || k === 'format') S.backoffUntil = Date.now() + 5 * 60000;
  }
  if (!e.kind) console.error(e);
}
async function syncNow(){
  if (!shared()){ setSync('local'); return; }
  if (syncing){ again = true; return; }
  if (S.backoffUntil && Date.now() < S.backoffUntil) return;
  syncing = true; clearTimeout(saveTimer);
  var cfg = S.cfg, hadPending = S.pending;
  if (canEdit() && S.pending) setSync('saving');
  try{
    var done = false;
    for (var i = 0; i < 5 && !done; i++){
      var remote = await GH.get(cfg, null);
      if (cfg !== S.cfg) return;
      var rdoc = remote.missing ? null : remote.doc;
      var merged = mergeDocs(rdoc || emptyDoc(), S.doc);
      var mustPush = canEdit() && (!rdoc || hasNewer(merged, rdoc));
      if (!mustPush){
        S.doc = merged; S.etag = remote.etag || null; S.pending = false; done = true; break;
      }
      setSync('saving');
      var res = await GH.put(cfg, merged, remote.missing ? null : remote.sha, commitMsg());
      if (cfg !== S.cfg) return;
      if (res.conflict){ await sleep(300 + Math.random() * 700); continue; }
      S.doc = mergeDocs(merged, S.doc);
      S.etag = null;
      S.pending = hasNewer(S.doc, merged);
      if (S.pending) again = true;
      done = true;
    }
    if (!done) throw mkErr('other', 'Beaucoup de modifications en même temps : nouvel essai dans un instant.');
    S.lastSync = Date.now(); S.backoffUntil = 0;
    setSync(S.pending ? 'pending' : 'ok', null, hadPending && !S.pending);
  }catch(e){
    handleErr(e);
    if (e.kind === 'other') again = false;
  }finally{
    syncing = false;
    persistDoc();
    requestRender();
    if (again){ again = false; clearTimeout(saveTimer); saveTimer = setTimeout(syncNow, 900); }
  }
}
async function poll(force){
  if (!shared() || syncing || polling) return;
  if (document.hidden && !force) return;
  if (S.backoffUntil && Date.now() < S.backoffUntil) return;
  if (S.pending && canEdit()) return syncNow();
  polling = true; lastPoll = Date.now();
  try{
    var cfg = S.cfg;
    var r = await GH.get(cfg, S.etag);
    if (cfg !== S.cfg) return;
    if (r.notModified){ S.lastSync = Date.now(); setSync('ok'); return; }
    if (r.missing){ if (canEdit()){ S.pending = true; polling = false; return syncNow(); } setSync('ok'); return; }
    var changed = hasNewer(r.doc, S.doc);
    S.doc = mergeDocs(r.doc, S.doc);
    S.etag = r.etag;
    if (canEdit() && hasNewer(S.doc, r.doc)){ S.pending = true; clearTimeout(saveTimer); saveTimer = setTimeout(syncNow, 500); }
    persistDoc();
    S.lastSync = Date.now();
    setSync(S.pending ? 'pending' : 'ok');
    if (changed) requestRender();
  }catch(e){ handleErr(e); }
  finally{ polling = false; }
}
setInterval(function(){
  var iv = (S.cfg && S.cfg.token) ? 20000 : 90000;
  if (Date.now() - lastPoll >= iv) poll();
}, 5000);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) poll(true);
  else if (S.pending && shared() && canEdit()){ flushNotes(); syncNow(); }
});
window.addEventListener('online', function(){ if (shared()) syncNow(); });

function setSync(state, msg, stamp){ S.sync = { state:state, msg:msg || '' }; updateSeal(stamp); }
function syncText(){
  if (!shared()) return 'Sur cet appareil seulement';
  var st = S.sync.state;
  if (st === 'saving') return 'Envoi au dépôt…';
  if (st === 'pending') return 'Modifications en attente d’envoi';
  if (st === 'offline' || st === 'error') return S.sync.msg;
  var t = canEdit() ? 'À jour' : 'Lecture seule, à jour';
  return S.lastSync ? t + ' à ' + fmtHM(S.lastSync) : t;
}
function updateSeal(stamp){
  var el = $('#sceau'), t = $('#etat'), txt = syncText();
  if (el){
    el.dataset.state = shared() ? S.sync.state : 'local';
    el.setAttribute('aria-label', 'Synchroniser. État : ' + txt);
    if (stamp){ el.classList.remove('frappe'); void el.offsetWidth; el.classList.add('frappe'); }
  }
  if (t) t.textContent = txt;
}

/* ============================================================
   Connexion, invitation
   ============================================================ */
function sameTarget(a, b){ return !!(a && b && a.owner === b.owner && a.repo === b.repo && a.path === b.path && a.branch === b.branch); }
async function doConnect(cfg, keepLocal){
  S.cnxMsg = 'Vérification du dépôt…'; render();
  try{
    var info = await GH.repo(cfg);
    var br = await GH.branch(cfg);
    if (!br){
      var main = info.default_branch && await GH.branch(Object.assign({}, cfg, { branch:info.default_branch }));
      if (!main) throw mkErr('notfound', 'Le dépôt « ' + cfg.repo + ' » est vide : sur GitHub, ajoute-lui un fichier README (bouton « Add a README »), puis relie à nouveau.');
      if (!cfg.token) throw mkErr('notfound', 'La branche « ' + cfg.branch + ' » n’existe pas dans ce dépôt (sa branche principale est « ' + info.default_branch + ' »).');
      S.cnxMsg = 'Création de la branche « ' + cfg.branch + ' »…'; render();
      await GH.createBranch(cfg, info.default_branch);
    }
    if (!keepLocal){ S.doc = seedDoc(); S.pending = false; }
    else if (hasUserData(S.doc)) S.pending = true;
    S.cfg = cfg; store.set(K.cfg, cfg);
    S.etag = null; S.backoffUntil = 0; S.cnxMsg = null; S.cnxDraft = {};
    await syncNow();

var SEAL = (function(){
  var n = 18, d = '';
  for (var i = 0; i < n; i++){
    var a0 = i / n * 2 * Math.PI, a1 = (i + .5) / n * 2 * Math.PI, a2 = (i + 1) / n * 2 * Math.PI;
    var p = function(a, r){ return (32 + r * Math.cos(a)).toFixed(2) + ' ' + (32 + r * Math.sin(a)).toFixed(2); };
    if (i === 0) d += 'M' + p(a0, 28.5);
    d += ' Q' + p(a1, 31.5) + ' ' + p(a2, 28.5);
  }
  return '<svg viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="cireG" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="#a8303f"/><stop offset=".55" stop-color="#7d1424"/><stop offset="1" stop-color="#4a0a14"/></radialGradient></defs>' +
    '<path class="cire" d="' + d + 'Z"/><circle class="anneau" cx="32" cy="32" r="21"/>' +
    '<path class="lunette" d="M37 21 A12 12 0 1 0 37 43 A11.5 11.5 0 0 1 37 21 Z"/></svg>';
})();
var FOREST = (function(){
  function layer(seed, minH, varH, cls){
    var W = 620, H = 46, s = seed, x = -8, d = 'M-10 ' + H;
    function rnd(){ s = (s * 16807) % 2147483647; return s / 2147483647; }
    while (x < W + 10){
      var tw = 15 + rnd() * 20, th = minH + rnd() * varH, b = H, cx = x + tw / 2;
      [[x, b], [cx - tw * .34, b - th * .3], [cx - tw * .17, b - th * .3], [cx - tw * .27, b - th * .57], [cx - tw * .11, b - th * .57], [cx - tw * .15, b - th * .8], [cx, b - th],
       [cx + tw * .15, b - th * .8], [cx + tw * .11, b - th * .57], [cx + tw * .27, b - th * .57], [cx + tw * .17, b - th * .3], [cx + tw * .34, b - th * .3], [x + tw, b]]
        .forEach(function(p){ d += ' L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1); });
      x += tw * (.5 + rnd() * .4);
    }
    return '<path class="' + cls + '" d="' + d + ' L' + (W + 10) + ' ' + H + ' Z"/>';
  }
  return '<svg class="foret" viewBox="0 0 620 46" preserveAspectRatio="xMidYMax slice" aria-hidden="true">' + layer(7, 22, 22, 'loin') + layer(29, 12, 20, 'pres') + '</svg>';
})();

/* --- Vue Bilan --- */
VIEWS.bilan = function(){
  var ranges = [['7', '7 jours'], ['30', '30 jours'], ['90', '3 mois'], ['all', 'Tout']];
  var r = ranges.some(function(x){ return x[0] === S.ui.range; }) ? S.ui.range : '30';
  var h = '<div class="segment" role="group" aria-label="Période">' + ranges.map(function(x){
    return '<button type="button" data-act="range" data-v="' + x[0] + '" aria-pressed="' + (x[0] === r) + '">' + x[1] + '</button>';
  }).join('') + '</div>';
  var today = todayStr(), from = r === 'all' ? '0000-00-00' : addDays(today, -(+r - 1));
  var ps = livePauses().filter(function(p){ return p.date >= from && p.date <= today; });
  var label = r === 'all' ? 'depuis le début' : r === '90' ? 'sur les 3 derniers mois' : 'sur les ' + r + ' derniers jours';
  if (!ps.length) return h + '<section class="page"><p class="cher">Bilan</p><h2 class="page-titre">Aucune pause notée ' + label + '.</h2></section>';
  var people = allPeople().filter(function(per){ return !per.archived || ps.some(function(p){ return entryHasData(getEntry(p.id, per.id)); }); });
  h += '<section class="page"><p class="cher">Bilan</p><h2 class="page-titre">' + ps.length + ' pause' + (ps.length > 1 ? 's' : '') + ' notée' + (ps.length > 1 ? 's' : '') + ' ' + label + '</h2>';
  if (!people.length) h += '<p class="page-sous" style="margin-top:12px">Ajoute des personnes dans les réglages pour voir leur bilan.</p>';
  people.forEach(function(per){
    var n = { present:0, late:0, absent:0 }, counts = {};
    ps.forEach(function(p){
      var e = getEntry(p.id, per.id);
      if (!e || !e.presence) return;
      n[e.presence]++;
      if (e.presence !== 'absent') behaviorsOf(e).forEach(function(b){ counts[b.id] = (counts[b.id] || 0) + 1; });
    });
    var noted = n.present + n.late + n.absent, here = n.present + n.late;
    var name = esc(per.name);
    h += '<div class="stat"><h3 class="pers-nom">' + name + (per.archived ? ' <span class="retire">(retiré·e)</span>' : '') + '</h3>';
    if (!noted){ h += '<p class="phrase">Rien de noté sur cette période.</p></div>'; return; }
    var pct = Math.round(here / noted * 100);
    h += '<p class="phrase">Présent·e à ' + here + ' pause' + (here > 1 ? 's' : '') + ' sur ' + noted + ' notée' + (noted > 1 ? 's' : '') + (n.late ? ', dont ' + n.late + ' en retard' : '') + '.</p>';
    h += barRow('Présence', pct, pct + ' %', 'sang', per.name + ' : présent·e ' + here + ' fois sur ' + noted + ' (' + pct + ' %)', true);
    var bs = allBehaviors().filter(function(b){ return counts[b.id]; }).sort(function(a, b){ return counts[b.id] - counts[a.id] || byOrder(a, b); });
    if (here && !bs.length) h += '<p class="phrase" style="margin-top:8px!important">Aucun comportement coché.</p>';

    });

};
function barRow(label, pct, val, cls, tip, strong){

}

    if (activePeople().some(function(p){ return p.name.toLowerCase() === n.toLowerCase(); })){ toast(n + ' est déjà dans le journal.'); return; }
    S.focusSel = '[data-form=addPerson] input';
    if (setFields('people', uid(), { name:n, archived:false })) toast(n + ' ajouté·e au journal.');
  },
  addBehavior:function(fd){
    var l = (fd.label || '').trim(); if (!l) return;
    S.focusSel = '[data-form=addBehavior] input[name=label]';
    setFields('behaviors', uid(), { emoji:(fd.emoji || '').trim(), label:l, group:'', order:activeBehaviors().length, archived:false });
  },
  addTemplate:function(fd){
    var l = (fd.label || '').trim(); if (!l) return;
    setFields('templates', uid(), { label:l, time:fd.time || '', order:0, archived:false });
  }
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled || el.closest('#feuille-root')) return;
  var f = A[el.dataset.act]; if (!f) return;
  e.preventDefault(); flushNotes(); f(el, e);
});
document.addEventListener('change', function(e){
  var el = e.target.closest && e.target.closest('[data-change]');
  if (!el || el.closest('#feuille-root')) return;
  var f = C[el.dataset.change]; if (f){ flushNotes(); f(el); }
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (!el.matches) return;
  if (el.matches('textarea[data-input=note]')) return onNoteInput(el);
  if (el.matches('form[data-form=cnx] input')){
    if (el.name === 'token'){
      var t = cleanToken(el.value);
      if (t !== el.value && tokenOk(t)) el.value = t;
      showTokenState(el.value);
    }
    S.cnxDraft[el.name] = el.value;
  }
});
document.addEventListener('focusout', function(e){
  if (e.target.matches && e.target.matches('textarea[data-input=note]')) flushNotes();
  if (renderPending) setTimeout(function(){ if (renderPending && !isEditing()) render(); }, 80);
});
document.addEventListener('submit', function(e){
  var f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); flushNotes();
  var fd = {}; new FormData(f).forEach(function(v, k){ fd[k] = v; });
  var h = FORMS[f.dataset.form]; if (h) h(fd, f);
});

/* Démarrage */
render();
checkInvite();
if (shared()){ if (S.pending && canEdit()) syncNow(); else poll(true); }
})();
</script>
</body>
</html>
